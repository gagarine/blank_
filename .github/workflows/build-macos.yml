name: Build macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            artifact: arm64
          - runner: macos-26-intel
            arch: x86_64
            artifact: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      EXPECTED_ARCH: ${{ matrix.arch }}
      ARCHIVE_NAME: blank_-macos-${{ matrix.artifact }}.zip
      WRITER_VERSION: ${{ github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          sw_vers
          xcodebuild -version

      - name: Cache toolchains and dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-v2-${{ hashFiles('scripts/bootstrap.sh', 'rust-toolchain.toml', 'Cargo.lock') }}

      - name: Install dependencies
        run: bash scripts/bootstrap.sh

      - name: Check Rust workspace
        run: bash scripts/check.sh

      - name: Build app
        run: bash scripts/build.sh

      - name: Verify and archive app
        run: |
          app=target/release/bundle/blank_.app
          test "$(lipo -archs "$app/Contents/MacOS/blank_")" = "$EXPECTED_ARCH"
          test "$(lipo -archs "$app/Contents/MacOS/writer-helper")" = "$EXPECTED_ARCH"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "target/release/bundle/$ARCHIVE_NAME"

      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blank_-macos-${{ matrix.artifact }}-${{ github.ref_name }}
          path: target/release/bundle/${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release and checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download both app archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blank_-macos-*-${{ github.ref_name }}
          path: target/releases
          merge-multiple: true

      - name: Generate checksums
        working-directory: target/releases
        run: sha256sum blank_-macos-arm64.zip blank_-macos-intel.zip > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh
