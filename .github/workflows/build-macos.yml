name: Native macOS

on:
  push:
    branches: [main, codex/swift-native]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build:
    name: Build and check (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '26.0'
      BLANK_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain versions
        run: |
          sw_vers
          swift --version
          xcrun --sdk macosx --show-sdk-version
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustc --version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
            typst-syntax-bridge/target
          key: native-${{ matrix.runner }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}
          restore-keys: native-${{ matrix.runner }}-${{ runner.arch }}-
      - name: Build release and run checks
        run: bash scripts/check.sh release
      - name: Verify portable bundle and archive
        run: |
          app=build/blank_.app
          codesign --verify --deep --strict "$app"
          for binary in blank_ libblank_syntax.dylib writer-helper; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64
          done
          # The editor must resolve its parser from the bundle, not this checkout.
          otool -L "$app/Contents/MacOS/blank_"
          otool -L "$app/Contents/MacOS/blank_" | grep '@rpath/libblank_syntax.dylib'
          ditto -c -k --sequesterRsrc --keepParent "$app" build/blank_-macos-${{ matrix.runner }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blank_-macos-${{ matrix.runner }}
          path: build/blank_-macos-${{ matrix.runner }}.zip
          if-no-files-found: error
          compression-level: 0

  publish-release:
    name: Attach app to published release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the SDK 27 app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blank_-macos-xcode-27
          path: release-assets
      - name: Attach archive and checksum
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mv blank_-macos-xcode-27.zip blank_-macos-arm64.zip
          sha256sum blank_-macos-arm64.zip > SHA256SUMS
          gh release upload "$RELEASE_TAG" blank_-macos-arm64.zip SHA256SUMS --clobber
