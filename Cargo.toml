[package]
name = "blank_"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
egui_richedit = "=0.7.0"
blank-document = { path = "crates/document" }
rfd = "0.17"
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
regex = "1"
fontdb = "0.23"
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "=0.21.0", default-features = false }
arboard = { version = "3", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSImage", "NSResponder", "NSView", "NSWindow", "NSScroller"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
block2 = "0.6"
raw-window-handle = "0.6"

[workspace]
members = [".", "crates/document", "crates/typst-helper", "xtask"]
default-members = ["."]
exclude = ["crates/library-assessment"]
resolver = "3"

[profile.dev]
debug = 1

[profile.release]
opt-level = 2
lto = "thin"
strip = true
