[package]
name = "typst-compiler"
version = "0.1.0"
edition = "2024"
build = "../scripts/macos-build.rs"

[dependencies]
typst.workspace = true
typst-syntax.workspace = true
typst-pdf.workspace = true
typst-layout.workspace = true
typst-kit = { workspace = true, features = ["embedded-fonts", "scan-fonts", "system-packages", "system-downloader", "datetime"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
comemo = "0.5"
hayagriva = "0.10.1"
serde_yaml = "0.9"
biblatex = "0.12"

[dev-dependencies]
flate2 = "1"
tar = "0.4"
